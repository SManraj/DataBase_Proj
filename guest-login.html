<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>User Login</title>
</head>
<body>
    <div class="login-container">
        <!-- Guest Login Form -->
        <h2>User Login</h2>
        <a href="index.html" class="button"> <button>Return Home</button></a>
        <form id="guest-login-form" action="guest-login.php" method="POST">
            <input type="text" id="guest-username" name="username" placeholder="Username" required>
            <input type="password" id="guest-password" name="password" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
    </div>

    <!-- Guest Dashboard -->
    <div id="guest_dashboard" class="dashboard-container" style="display: none;">
        <h2>Login Successful: <span id="user-name">User_Name</span></h2>
        <a href="index.html" class="button"> <button>Return Home</button></a>
        <p>Welcome, <span id="guest-name">FName Middle_I LName</span></p>
        <table border="1">
            <thead>
                <tr>
                    <th>UserID</th>
                    <th>PhoneNum</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="user-id"></td>
                    <td id="user-phone"></td>
                    <td id="user-email"></td>
                </tr>
            </tbody>
        </table>
        <p>Rented Items</p>
        <table border="1">
            <thead>
                <tr>
                    <th>Book_ID</th>
                    <th>Rent_Date</th>
                    <th>Return_Date</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by PHP -->
            </tbody>
        </table>
    </div>
</body>
</html>
